name: CI

# Gates on what is true today, reports on what is not yet, and ratchets.
# Rationale: docs/decisions/0006-ci-gating-and-the-lint-baseline.md
#
#   typecheck + build  → blocking (both pass at the recorded baseline)
#   lint               → advisory (45 known errors; see docs/tech-debt.md §1)
#   lint ratchet       → blocking on *regression* only (count must stay <= BASELINE)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The recorded ESLint error count at commit 102e524. May only decrease.
  # When it reaches 0, remove `continue-on-error` from the lint step and
  # delete the ratchet step — see ADR-0006.
  LINT_BASELINE: 45

jobs:
  quality:
    name: typecheck · build · lint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc -b, strict)
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Report bundle size
        run: |
          echo "### Production bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h dist/index.html dist/assets/* | sort -k2 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Budget: gzipped JS <= 95 kB — see docs/performance.md#7-budget" >> "$GITHUB_STEP_SUMMARY"

      - name: Lint (advisory — ${{ env.LINT_BASELINE }}-error baseline, see ADR-0006)
        if: matrix.node == 22
        continue-on-error: true
        run: |
          npx eslint . -f stylish
          npx eslint . -f json -o eslint-report.json

      - name: Lint ratchet (fails only on regression)
        if: matrix.node == 22 && always()
        run: |
          node -e '
            const fs = require("fs");
            const baseline = Number(process.env.LINT_BASELINE);
            if (!fs.existsSync("eslint-report.json")) {
              console.log("No ESLint report produced — skipping ratchet.");
              process.exit(0);
            }
            const report = JSON.parse(fs.readFileSync("eslint-report.json", "utf8"));
            const errors = report.reduce((n, f) => n + f.errorCount, 0);
            const warnings = report.reduce((n, f) => n + f.warningCount, 0);
            const files = report.filter(f => f.errorCount > 0).length;
            console.log(`ESLint: ${errors} errors, ${warnings} warnings across ${files} files (baseline ${baseline}).`);
            if (errors > baseline) {
              console.error(`::error::Lint baseline regressed: ${errors} > ${baseline}. New errors must be fixed — see CONTRIBUTING.md §1.`);
              process.exit(1);
            }
            if (errors < baseline) {
              console.log(`::notice::Baseline improved to ${errors}. Update LINT_BASELINE in .github/workflows/ci.yml and docs/tech-debt.md §1 in this PR.`);
            }
            if (errors === 0) {
              console.log("::notice::Baseline cleared. Remove continue-on-error from the lint step and delete this ratchet step (ADR-0006).");
            }
          '

      # Advisory for the same reason as lint: the tree currently carries 4 high-severity
      # transitive advisories, all build-time, none in the shipped bundle.
      # Evidence and remediation: SECURITY.md §5.1 and docs/tech-debt.md#td-22.
      - name: Dependency audit (advisory — see SECURITY.md §5.1)
        if: matrix.node == 22 && always()
        continue-on-error: true
        run: |
          echo "### Dependency audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev 2>&1 | tail -12 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          prod=$(npm audit --omit=dev --json 2>/dev/null | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).metadata.vulnerabilities.total))' 2>/dev/null || echo "?")
          all=$(npm audit --json 2>/dev/null | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).metadata.vulnerabilities.total))' 2>/dev/null || echo "?")
          plural() { [ "$1" = "1" ] && echo advisory || echo advisories; }
          echo "production tree (--omit=dev): $prod $(plural "$prod") · full tree: $all $(plural "$all")"
          if [ "$prod" != "0" ]; then
            echo "::warning::Production dependency tree reports $prod $(plural "$prod") — SECURITY.md §5.1, remediation is roadmap D22"
            exit 1
          fi

      - name: Upload ESLint report
        if: matrix.node == 22 && always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          if-no-files-found: ignore
          retention-days: 14

      # Advisory here, blocking in deploy.yml: CI reports what is not yet true,
      # the deploy workflow refuses to ship it. See ADR-0006.
      - name: Preview instrumentation check (advisory — TD-15, TD-16)
        if: matrix.node == 22 && always()
        continue-on-error: true
        run: |
          status=0
          if grep -q 'data-arena\|data-element-picker' dist/index.html; then
            echo "::warning::dist/index.html contains injected preview tooling (TD-15). Must be stripped before deploying — docs/deployment.md#61-injected-scripts-in-indexhtml"
            status=1
          fi
          if grep -q 'data-source-loc' dist/assets/*.js 2>/dev/null; then
            count=$(grep -o 'data-source-loc' dist/assets/*.js | wc -l)
            echo "::warning::Bundle contains $count data-source-loc attributes (TD-16). Gate .vite-source-tags.js to development — docs/deployment.md#62-the-source-tags-vite-plugin"
            status=1
          fi
          if [ "$status" -eq 0 ]; then echo "Build artifact is clean."; fi
          exit $status

  # Joins here once docs/testing.md §5 lands:
